<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Corpo da Calculadora -->
    <div class="retro-body w-full max-w-sm p-6 shadow-2xl border-b-8 border-r-4 border-black/20">
        
        <!-- Cabeçalho Vintage: Logo + Painel Solar -->
        <div class="flex items-center justify-between mb-5 px-1">
            <div class="flex flex-col">
                <span class="text-xs font-black tracking-widest text-gray-700 uppercase" style="font-family: 'Press Start 2P', cursive; font-size: 9px;">TEXAS-80</span>

                <div class="w-1/4 h-full border-r border-amber-900/50"></div>
                <div class="w-1/4 h-full border-r border-amber-900/50"></div>
                <div class="w-1/4 h-full"></div>
            </div>
        </div>

        <!-- Chave do Som & Power -->
        <div class="flex justify-between items-center mb-4 px-2 text-xs font-bold text-gray-600">
            <div class="flex items-center space-x-2">

            <div class="flex items-center space-x-1">

        <!-- Moldura do Display -->

            <!-- Tela VFD -->
            <div class="vfd-screen rounded p-3 h-20 flex flex-col justify-between items-end relative">
                
                <!-- Linha Superior: Memória e Operador Atual -->
                <div class="w-full flex justify-between items-center text-xs">
                    <span id="memoryIndicator" class="vfd-op opacity-0">M</span>
                    <span id="historyDisplay" class="vfd-op text-sm opacity-80 overflow-hidden whitespace-nowrap text-right max-w-[200px]"></span>
                </div>

                <!-- Display Principal (Camada de Fundo Esmaecida + Camada Ativa) -->
                <div class="relative w-full text-right overflow-hidden">
                    <!-- Fundo de Segmentos Apagados (Efeito LCD/VFD Real) -->
                    <div class="vfd-text vfd-text-dim text-4xl leading-none absolute right-0 top-0 select-none pointer-events-none">
                        888888888888
                    </div>

            <button onclick="handleAction('toggle-sign')" data-key="±" class="btn-retro btn-num h-12 text-base font-bold flex items-center justify-center">+ / -</button>
            <button onclick="handleAction('percent')" data-key="%" class="btn-retro btn-num h-12 text-base font-bold flex items-center justify-center">%</button>
            <button onclick="handleAction('operator', '/')" data-key="/" class="btn-retro btn-op h-12 text-lg font-bold flex items-center justify-center">÷</button>

            <!-- Linha 2 -->
            <button onclick="handleAction('digit', '7')" data-key="7" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">7</button>
            <button onclick="handleAction('digit', '8')" data-key="8" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">8</button>
            <button onclick="handleAction('digit', '9')" data-key="9" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">9</button>
            <button onclick="handleAction('operator', '*')" data-key="*" class="btn-retro btn-op h-12 text-lg font-bold flex items-center justify-center">×</button>

            <!-- Linha 3 -->
            <button onclick="handleAction('digit', '4')" data-key="4" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">4</button>
            <button onclick="handleAction('digit', '5')" data-key="5" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">5</button>
            <button onclick="handleAction('digit', '6')" data-key="6" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">6</button>

            <button onclick="handleAction('digit', '2')" data-key="2" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">2</button>
            <button onclick="handleAction('digit', '3')" data-key="3" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center">3</button>

            <button onclick="handleAction('digit', '0')" data-key="0" class="btn-retro btn-num h-12 text-xl font-bold flex items-center justify-center col-span-1">0</button>

        <!-- Rodapé da Carcaça com Textura -->
        <div class="mt-6 flex justify-between items-center text-[10px] text-gray-500 font-semibold uppercase tracking-wider">
            <span>MODEL TI-1982</span>
            <span>MADE IN JAPAN</span>
        </div>

    </div>

    <!-- Script de Lógica da Calculadora e Som Synth Vintage -->
    <script>
        // Estado da Calculadora
        let currentInput = '0';
        let previousInput = null;
        let activeOperator = null;
        let shouldResetInput = false;
        let isSoundEnabled = true;

        // Elementos DOM
        const displayEl = document.getElementById('display');
        const historyDisplayEl = document.getElementById('historyDisplay');
        const soundKnob = document.getElementById('soundKnob');

        // Sintetizador de Som Web Audio API (Sem dependência de arquivos externos)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playKeyBeep(frequency = 600, duration = 0.03) {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square'; // Som oitavado de relógio digital vintage
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        // Alternar Som
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            if (isSoundEnabled) {
                soundKnob.style.transform = 'translateX(0px)';
                playKeyBeep(800, 0.05);
            } else {
                soundKnob.style.transform = 'translateX(20px)';
            }
        }

        // Atualização da Tela
        function updateDisplay() {
            // Limitar a exibição para no máximo 12 caracteres para caber na tela retrô
            let formattedDisplay = currentInput;
            
            if (formattedDisplay.length > 12) {
                const num = parseFloat(formattedDisplay);
                if (!isNaN(num)) {
                    formattedDisplay = num.toPrecision(7).toString();
                } else {
                    formattedDisplay = "ERROR";
                }
            }
            
            displayEl.textContent = formattedDisplay;

            // Histórico do Operador
            if (previousInput !== null && activeOperator !== null) {
                const opSymbol = activeOperator === '*' ? '×' : activeOperator === '/' ? '÷' : activeOperator;
                historyDisplayEl.textContent = `${previousInput} ${opSymbol}`;
            } else {
                historyDisplayEl.textContent = '';
            }
        }

        // Ações da Calculadora
        function handleAction(type, value = null) {
            playKeyBeep(type === 'calculate' ? 900 : type === 'clear' ? 400 : 650);

            switch (type) {
                case 'digit':
                    if (currentInput === '0' || shouldResetInput) {
                        currentInput = value;
                        shouldResetInput = false;
                    } else {
                        if (currentInput.replace('-', '').length < 10) {
                            currentInput += value;
                        }
                    }
                    break;

                case 'decimal':
                    if (shouldResetInput) {
                        currentInput = '0.';
                        shouldResetInput = false;
                    } else if (!currentInput.includes('.')) {
                        currentInput += '.';
                    }
                    break;

                case 'toggle-sign':
                    if (currentInput !== '0') {
                        currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                    }
                    break;

                case 'percent':
                    currentInput = (parseFloat(currentInput) / 100).toString();
                    break;

                case 'backspace':
                    if (shouldResetInput) break;
                    if (currentInput.length > 1) {
                        currentInput = currentInput.slice(0, -1);
                        if (currentInput === '-') currentInput = '0';
                    } else {
                        currentInput = '0';
                    }
                    break;

                case 'clear':
                    currentInput = '0';
                    previousInput = null;
                    activeOperator = null;
                    shouldResetInput = false;
                    break;

                case 'operator':
                    if (activeOperator !== null && !shouldResetInput) {
                        computeResult();
                    }
                    previousInput = currentInput;
                    activeOperator = value;
                    shouldResetInput = true;
                    break;

                case 'calculate':
                    if (activeOperator !== null && previousInput !== null) {
                        computeResult();
                        previousInput = null;
                        activeOperator = null;
                        shouldResetInput = true;
                    }
                    break;
            }

            updateDisplay();
        }

        // Executa o Cálculo Matemático
        function computeResult() {
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            let result = 0;
            switch (activeOperator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        currentInput = "ERRO: DIV/0";
                        shouldResetInput = true;
                        return;
                    }
                    result = prev / current;
                    break;
            }

            // Arredondamento para evitar imprecisão de pontos flutuantes do JS
            result = Math.round(result * 1e10) / 1e10;
            currentInput = result.toString();
        }

        // Suporte para Entrada via Teclado Físico
        window.addEventListener('keydown', (e) => {
            let key = e.key;

            // Mapeamento de teclas
            if (key >= '0' && key <= '9') {
                handleAction('digit', key);
                animateButton(`[data-key="${key}"]`);
            } else if (key === '.' || key === ',') {
                handleAction('decimal');
                animateButton('[data-key="."]');
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                handleAction('operator', key);
                animateButton(`[data-key="${key}"]`);
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                handleAction('calculate');
                animateButton('[data-key="Enter"]');
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                handleAction('clear');
                animateButton('[data-key="Escape"]');
            } else if (key === 'Backspace') {
                handleAction('backspace');
                animateButton('[data-key="Backspace"]');
            } else if (key === '%') {
                handleAction('percent');
                animateButton('[data-key="%"]');
            }
        });

        // Efeito Visual de Pressionar Tecla
        function animateButton(selector) {
            const btn = document.querySelector(selector);
            if (btn) {
                btn.classList.add('active');
                setTimeout(() => {
                    btn.classList.remove('active');
                }, 100);
            }
        }

        // Inicializar visual padrão ao carregar
        window.onload = function () {
            updateDisplay();
        };
    </script>
</body>
</html>
